<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Employee Prediction Pipeline</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <header class="navbar">
        <div class="nav-brand">
            <div class="logo-icon">EP</div>
            <a href="/" style="color:var(--text-primary);">PredictiveTalent<span style="color:var(--primary);">AI</span></a>
        </div>
        <div class="nav-links">
            <a href="/signup" class="btn btn-primary btn-sm">Create Account</a>
            <button id="theme-toggle-btn" class="btn-icon" aria-label="Toggle Theme">☀️</button>
        </div>
    </header>

    <main class="container" style="flex:1; display:flex; align-items:center; justify-content:center; padding:2.5rem 1rem;">
        <div class="card" style="width:100%; max-width:440px; padding:2.5rem 2rem;">
            <div style="text-align:center; margin-bottom:2rem;">
                <span class="badge badge-primary" style="margin-bottom:0.75rem;">Secure Authentication</span>
                <h2 style="font-size:1.8rem; margin-bottom:0.4rem;">Welcome Back</h2>
                <p style="font-size:0.9rem; color:var(--text-secondary);">
                    Sign in to access your employee predictive analytics dashboard.
                </p>
            </div>

            <form id="signin-form">
                <div class="form-group">
                    <label class="form-label" for="email">Work Email</label>
                    <input type="email" id="email" class="form-control" placeholder="name@enterprise.ai" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; padding:0.85rem; font-size:1rem; margin-top:0.5rem;">
                    Sign In to Dashboard
                </button>
            </form>

            <!-- Quick Demo Button -->
            <div style="margin-top:1.25rem; text-align:center;">
                <button type="button" id="demo-fill-btn" class="btn btn-secondary btn-sm" style="width:100%;">
                    ⚡ Click to Auto-Fill Sample Credentials
                </button>
            </div>

            <div style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--text-secondary);">
                Don't have an account yet? <a href="/signup" style="font-weight:600;">Create an account</a>
            </div>
        </div>
    </main>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
